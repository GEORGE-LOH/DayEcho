name: DayEcho
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  DayEcho:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: DayEcho
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 录制你主动开始的语音记录。
        NSSpeechRecognitionUsageDescription: 在设备上将录音转换为可搜索文字。
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DayEcho
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: DayEchoWatch
        embed: true
  DayEchoWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: DayEcho
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.DayEcho
        NSMicrophoneUsageDescription: 录制你主动开始的语音记录并传到配对 iPhone。
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DayEcho.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
  DayEchoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DayEcho
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DayEchoWatch:
    build:
      targets:
        DayEchoWatch: all
  DayEcho:
    build:
      targets:
        DayEcho: all
        DayEchoWatch: all
    test:
      targets: [DayEchoTests]
