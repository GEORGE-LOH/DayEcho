name: Apple build and tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iPhone + Watch simulator
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          fi

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          xcodebuild -version | tee ci-results/xcode-version.txt
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version | tee ci-results/xcodegen-version.txt
          xcodegen generate
          xcodebuild -list -project DayEcho.xcodeproj | tee ci-results/project.txt

      - name: Build iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DayEcho.xcodeproj -scheme DayEcho \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ci-results/iphone-build.log

      - name: Build Watch app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DayEcho.xcodeproj -scheme DayEchoWatch \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath WatchDerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ci-results/watch-build.log

      - name: Choose available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > ci-results/devices.json
          python3 scripts/select_simulator.py ci-results/devices.json >> "$GITHUB_ENV"

      - name: Run XCTest
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DayEcho.xcodeproj -scheme DayEcho \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData -resultBundlePath ci-results/DayEcho.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee ci-results/tests.log

      - name: Package simulator apps
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/DayEcho.app ci-results/DayEcho-iPhone-Simulator.zip
          ditto -c -k --keepParent WatchDerivedData/Build/Products/Debug-watchsimulator/DayEchoWatch.app ci-results/DayEcho-Watch-Simulator.zip

      - name: Upload logs, tests and simulator apps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DayEcho-build-${{ github.run_number }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
